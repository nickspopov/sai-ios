mutation CreateCommunityPlace($input: CommunityPlaceInput!) {
  createCommunityPlace(input: $input) {
    id
    name
    owner {
      id
      name
    }
    places {
      id
      name
      lat
      lon
    }
    members {
      user {
        id
      	name
      }
      lastCheckin {
        date
        place {
          id
          name
        }
      }
    }
  }
}