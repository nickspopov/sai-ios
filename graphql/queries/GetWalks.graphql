query getWalks($fromDate: DateTimeType, $toDate: DateTimeType, $limit: Int) {
  getWalks(fromDate: $fromDate, toDate: $toDate, limit: $limit) {
    id
    startedAt
    finishedAt
    avgPace
    avgSpeed
    distance
    duration
    walkHistory {
      history {
        latitude
        longitude
        timestamp
      }
    }
  }
}
